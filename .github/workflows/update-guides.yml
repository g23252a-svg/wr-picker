name: Update guides

# 챔피언 가이드는 패치 때나 바뀌므로 매일 돌릴 필요가 없다(141페이지 요청).
# 주 1회 + 필요할 때 수동 실행으로 충분하다.
on:
  schedule:
    - cron: '40 4 * * 1'   # 매주 월요일 04:40 UTC ≈ 13:40 KST (통계 갱신 뒤)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-guides
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch champion guides
        run: |
          set -o pipefail
          node scripts/fetch-guides.mjs 2>&1 | tee guides.log

      - name: Verify the app still loads
        run: npm test

      - name: Commit when guides changed
        run: |
          if [ -z "$(git status --porcelain data/guides.json)" ]; then
            echo "no guide change — nothing to commit"
            exit 0
          fi
          count=$(node -p "Object.keys(require('./data/guides.json').champions).length")
          {
            echo "chore(guides): refresh champion guides (${count} champions)"
            echo
            cat guides.log
          } > commit-msg.txt
          rm -f guides.log
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/guides.json
          git commit -F commit-msg.txt
          rm -f commit-msg.txt
          git push
